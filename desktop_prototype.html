<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>623Hub — 台灣格鬥遊戲賽事與直播資訊（電腦版原型）</title>
<style>
  :root {
    --bg: #0B1020;
    --bg2: #131829;
    --card: #1C2236;
    --card2: #222840;
    --accent: #A855F7;
    --accent-dim: rgba(168,85,247,0.12);
    --accent-dim2: rgba(168,85,247,0.06);
    --text: #FFFFFF;
    --text2: #A0A8C0;
    --text3: #666A7A;
    --live-red: #FF4444;
    --radius: 12px;
    --radius-sm: 8px;
    --rail-w: 88px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Noto Sans TC', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ── App shell: 左側導覽 + 中間主區 + 右側資訊欄 ── */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }

  /* ── 左側導覽欄 ── */
  .side-rail {
    width: var(--rail-w);
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 100;
  }
  .rail-logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 28px;
    letter-spacing: -0.5px;
  }
  .rail-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    align-items: center;
  }
  .rail-item {
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 9px 0;
    border-radius: var(--radius-sm);
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .rail-item:hover { background: rgba(255,255,255,0.04); color: var(--text2); }
  .rail-item.active { color: var(--accent); background: var(--accent-dim2); }
  .rail-item svg { width: 21px; height: 21px; }
  .rail-item span { font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em; }

  /* ── 內容區（左側導覽欄之外的全部） ── */
  .main-area {
    margin-left: var(--rail-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .top-bar {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .top-bar-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .top-bar-title span { color: var(--accent); }
  .top-bar-tagline {
    font-size: 12px;
    color: var(--text3);
    margin-left: 10px;
    font-weight: 500;
  }
  .top-bar-meta {
    font-size: 12px;
    color: var(--text3);
  }

  /* ── 主區 + 右側欄 並排 ── */
  .content-row {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 28px;
    padding: 24px 32px 48px;
    overflow-y: auto;
  }

  .main-col {
    flex: 3 1 0%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .side-col {
    flex: 1 1 0%;
    min-width: 280px;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: sticky;
    top: 24px;
    align-self: flex-start;
  }

  /* placeholder blocks for now */
  .placeholder-block {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.04);
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    font-size: 13px;
  }

  /* ── Hero 區：左主播 + 右側其他進行中賽事 ── */
  .hero-row {
    display: flex;
    gap: 16px;
    align-items: stretch;
  }
  .hero-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .hero-tabs {
    display: flex;
    gap: 22px;
    margin-bottom: 12px;
  }
  .hero-tab {
    font-size: 14px;
    font-weight: 700;
    color: var(--text3);
    cursor: pointer;
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    border: none;
  }
  .hero-tab.active { color: var(--text); border-color: var(--accent); }
  .hero-tab:hover:not(.active) { color: var(--text2); }

  .hero-panel-wrap {
    position: relative;
    flex: 1;
  }
  .hero-panel {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16/7.2;
    background: linear-gradient(135deg, #1a2240 0%, #0d1830 50%, #1a2840 100%);
    display: flex;
    align-items: flex-end;
  }
  .hero-panel-img {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  .hero-panel-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(11,16,32,0.95) 0%, rgba(11,16,32,0.35) 48%, transparent 100%);
  }
  .hero-panel-content {
    position: relative;
    width: 100%;
    padding: 26px 30px;
  }
  .hero-evt-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .hero-evt-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hero-live-badge {
    background: var(--live-red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.08em;
  }
  .hero-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 14px;
  }
  .hero-streamer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .hero-avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }
  .hero-streamer-name { font-size: 15px; font-weight: 700; }
  .hero-watching-label { font-size: 12px; color: var(--text3); margin-left: 3px; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 22px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s;
  }
  .btn-primary:hover { filter: brightness(1.1); }

  /* Hero 左右切換箭頭 */
  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(11,16,32,0.55);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 5;
    transition: background 0.15s;
    opacity: 0;
  }
  .hero-panel-wrap:hover .hero-arrow { opacity: 1; }
  .hero-arrow:hover { background: rgba(168,85,247,0.5); }
  .hero-arrow.prev { left: 14px; }
  .hero-arrow.next { right: 14px; }
  .hero-arrow svg { width: 18px; height: 18px; }
  .hero-arrow.disabled { opacity: 0 !important; pointer-events: none; }

  /* Hero 點點指示器 */
  .hero-dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 5;
  }
  .hero-dot {
    width: 6px; height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    border: none;
    transition: width 0.2s, background 0.2s;
  }
  .hero-dot.active { width: 18px; background: var(--accent); }

  /* ── 右側：其他進行中賽事 ── */
  .rail-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .rail-card-header {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rail-card-header h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 0.02em;
  }
  .other-event-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }
  .other-event-item:hover { background: rgba(255,255,255,0.03); }
  .other-event-item.active { background: var(--accent-dim2); }
  .other-event-thumb {
    width: 52px; height: 36px;
    border-radius: 6px;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    background-color: var(--card2);
  }
  .other-event-info { min-width: 0; flex: 1; }
  .other-event-name {
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .other-event-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live-dot-sm {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--live-red);
    flex-shrink: 0;
  }

  /* ── 觀賽直播／官方主台 網格 ── */
  .grid-section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .grid-section-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .grid-section-header h2 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .grid-section-count {
    font-size: 12px;
    color: var(--text3);
    font-weight: 600;
  }
  .stream-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .stream-card {
    background: var(--card);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .stream-card:hover {
    border-color: rgba(168,85,247,0.35);
    transform: translateY(-2px);
  }
  .stream-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a2240, #2a3460);
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .stream-live-dot {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--live-red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.06em;
  }
  .stream-viewers {
    position: absolute;
    bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .stream-info { padding: 10px 12px 12px; }
  .stream-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stream-game {
    font-size: 11.5px;
    color: var(--text3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Banner 輪播 ── */
  .banner-carousel {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16/4.2;
    background: var(--card2);
  }
  .banner-slide {
    position: absolute;
    inset: 0;
    display: none;
    background-size: cover;
    background-position: center;
  }
  .banner-slide.active { display: block; }
  .banner-slide-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(11,16,32,0.92) 0%, rgba(11,16,32,0.55) 55%, rgba(11,16,32,0.15) 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 36px;
  }
  .banner-slide-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .banner-slide-desc {
    font-size: 12.5px;
    color: var(--text2);
  }
  .banner-dots {
    position: absolute;
    bottom: 12px;
    right: 16px;
    display: flex;
    gap: 5px;
  }
  .banner-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    border: none;
    cursor: pointer;
  }
  .banner-dot.active { background: var(--accent); width: 14px; border-radius: 3px; }

  /* ── 右側欄：現正進行中／近期賽事 列表 ── */
  .rail-card-header .more-link {
    font-size: 11.5px;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
  }
  .rail-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.15s;
  }
  .rail-list-item:hover { background: rgba(255,255,255,0.03); }
  .rail-list-thumb {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--card2);
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .rail-list-info { min-width: 0; flex: 1; }
  .rail-list-name {
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rail-list-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rail-list-empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text3);
    font-size: 12px;
  }

  /* ── 分頁切換 ── */
  .page-view { display: none; }
  .page-view.active { display: flex; }

  /* ── 直播頁 ── */
  .live-page-header {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .live-page-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .live-title-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--live-red);
    box-shadow: 0 0 0 3px rgba(255,68,68,0.2);
  }
  .filter-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: var(--text2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .chip:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
  .chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .offline-toggle-row { margin: 32px 0 16px; }
  .offline-toggle-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 0;
    transition: color 0.15s;
  }
  .offline-toggle-btn:hover { color: var(--text2); }
  .offline-toggle-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
  .offline-toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .offline-arrow { display: inline-block; transition: transform 0.25s ease; font-size: 11px; }
  .offline-toggle-btn.open .offline-arrow { transform: rotate(90deg); }
  .offline-grid .stream-card { opacity: 0.45; }
  .offline-grid .stream-card:hover { opacity: 0.8; }

  /* ── 賽事頁 ── */
  .events-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .events-page-header h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .tw-toggle-row { display: flex; align-items: center; gap: 9px; }
  .toggle-label { font-size: 12.5px; color: var(--text2); }
  .toggle {
    width: 36px; height: 20px;
    background: var(--card2);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(16px); }

  .tabs {
    display: flex;
    gap: 28px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 22px;
  }
  .tab {
    padding: 0 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: none;
    border: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text2); }

  .events-panel { display: none; }
  .events-panel.active { display: block; }

  .event-card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .evcard {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.04);
    transition: border-color 0.15s;
  }
  .evcard:hover { border-color: rgba(168,85,247,0.25); }
  .evcard-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .evcard-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
  .evcard-name {
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.3;
  }
  .evcard-date { font-size: 12px; color: var(--text2); margin-top: 5px; }
  .evcard-desc { font-size: 12px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
  .evcard-schedule-btn {
    padding: 7px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .tag-live {
    background: rgba(255,68,68,0.15);
    color: var(--live-red);
    border: 1px solid rgba(255,68,68,0.3);
  }
  .tag-tw {
    background: rgba(168,85,247,0.2);
    color: #C084FC;
    border: 1px solid rgba(168,85,247,0.5);
    font-weight: 700;
  }
  .tag-weekly {
    background: rgba(255,255,255,0.06);
    color: var(--text2);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* Loading state */
  .loading { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>

<div class="app-shell">
  <!-- 左側導覽欄 -->
  <nav class="side-rail">
    <div class="rail-logo">62</div>
    <div class="rail-nav">
      <button class="rail-item" data-page="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49"/><path d="M7.76 16.24a6 6 0 0 1 0-8.49"/><path d="M20.07 4.93a10 10 0 0 1 0 14.14"/><path d="M3.93 19.07a10 10 0 0 1 0-14.14"/>
        </svg>
        <span>直播</span>
      </button>
      <button class="rail-item active" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首頁</span>
      </button>
      <button class="rail-item" data-page="events">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>賽事</span>
      </button>
    </div>
  </nav>

  <!-- 主內容區 -->
  <div class="main-area">
    <div class="top-bar">
      <div style="display:flex;align-items:baseline;">
        <div class="top-bar-title">623<span>Hub</span></div>
        <div class="top-bar-tagline">一站追蹤台灣格鬥遊戲賽事、直播資訊</div>
      </div>
      <div class="top-bar-meta">最後更新：<span id="last-updated-time">--:--</span></div>
    </div>

    <!-- ══════════════ 首頁 ══════════════ -->
    <div class="content-row page-view active" id="page-home">
      <div class="main-col">
        <div class="hero-row">
          <div class="hero-main">
            <div class="hero-tabs" id="hero-tabs">
              <button class="hero-tab active" data-tab="hot">熱門直播</button>
              <button class="hero-tab" data-tab="official">賽事主台</button>
            </div>
            <div class="hero-panel-wrap">
              <button class="hero-arrow prev" id="hero-prev" aria-label="上一場比賽">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button class="hero-arrow next" id="hero-next" aria-label="下一場比賽">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
              <div class="hero-panel" id="hero-panel">
                <div class="hero-panel-img" id="hero-panel-img"></div>
                <div class="hero-panel-gradient"></div>
                <div class="hero-panel-content" id="hero-panel-content"></div>
              </div>
              <div class="hero-dots" id="hero-dots"></div>
            </div>
          </div>
        </div>
        <div class="grid-section">
          <div class="grid-section-header">
            <h2>觀賽直播</h2>
            <span class="grid-section-count" id="watchparty-count"></span>
          </div>
          <div class="stream-grid" id="watchparty-grid"></div>
        </div>
        <div class="grid-section" id="official-section">
          <div class="grid-section-header">
            <h2>官方主台</h2>
            <span class="grid-section-count" id="official-count"></span>
          </div>
          <div class="stream-grid" id="official-grid"></div>
        </div>
        <div class="banner-carousel" id="banner-home"></div>
      </div>
      <div class="side-col">
        <div class="rail-card">
          <div class="rail-card-header"><h3>現正進行中</h3></div>
          <div id="livenow-list"></div>
        </div>
        <div class="rail-card">
          <div class="rail-card-header">
            <h3>近期賽事</h3>
            <span class="more-link">看更多 ›</span>
          </div>
          <div id="upcoming-list"></div>
        </div>
      </div>
    </div>

    <!-- ══════════════ 直播頁 ══════════════ -->
    <div class="content-row page-view" id="page-live">
      <div class="main-col" style="flex:1;">
        <div class="live-page-header">
          <div class="live-page-title"><span class="live-title-dot"></span>LIVE</div>
          <div class="filter-chips" id="live-filter-chips"></div>
        </div>
        <div class="stream-grid" id="live-online-grid"></div>

        <div class="offline-toggle-row" id="offline-toggle-row">
          <button class="offline-toggle-btn" id="offline-toggle-btn">
            <span class="offline-toggle-line"></span>
            <span class="offline-toggle-label">OFFLINE <span id="offline-count-label"></span><i class="offline-arrow">›</i></span>
            <span class="offline-toggle-line"></span>
          </button>
        </div>
        <div class="stream-grid offline-grid" id="live-offline-grid" style="display:none;"></div>
      </div>
    </div>

    <!-- ══════════════ 賽事頁 ══════════════ -->
    <div class="content-row page-view" id="page-events">
      <div class="main-col" style="flex:1;">
        <div class="events-page-header">
          <h2>賽事列表</h2>
          <div class="tw-toggle-row">
            <span class="toggle-label">只看台灣選手</span>
            <div class="toggle" id="tw-toggle"></div>
          </div>
        </div>

        <div class="tabs" id="events-tabs">
          <button class="tab active" data-tab="featured">焦點大賽</button>
          <button class="tab" data-tab="community">社群 &amp; 聯賽</button>
        </div>

        <div class="events-panel active" id="events-featured-panel">
          <div class="event-card-grid" id="events-featured-grid"></div>
        </div>

        <div class="events-panel" id="events-community-panel">
          <div class="banner-carousel" id="banner-community" style="margin-bottom:28px;"></div>
          <div class="grid-section-header" style="margin-bottom:14px;"><h2>社群</h2></div>
          <div class="event-card-grid" id="events-social-grid"></div>
          <div class="grid-section-header" style="margin:28px 0 14px;"><h2>聯賽</h2></div>
          <div class="event-card-grid" id="events-league-grid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="dataLoader.js"></script>
<script>
// ════════════════════════════════════════════
// 全��資料存儲
// ════════════════════════════════════════════
let appData = {
  events: [],
  streams: [],
  banners: [],
};

// ════════════════════════════════════════════
// 工具函式
// ════════════════════════════════════════════

/**
 * 渲染串流卡片
 */
function renderStreamCard(s) {
  return `
    <div class="stream-card">
      <div class="stream-thumb" style="background-image:url(${s.縮圖URL})">
        <span class="stream-live-dot">LIVE</span>
        <span class="stream-viewers">👁 ${s.觀看人數.toLocaleString()}</span>
      </div>
      <div class="stream-info">
        <div class="stream-name">${s.頻道名稱}</div>
        <div class="stream-game">${s.當前遊戲}</div>
      </div>
    </div>`;
}

/**
 * 組織流媒體（分類 & 過濾）
 */
function organizeStreams() {
  const online = appData.streams.filter(s => s.線上);
  const offline = appData.streams.filter(s => !s.線上);
  const official = online.filter(s => s.分類 === 'official');
  const watchparty = online.filter(s => s.分類 !== 'official');

  return { official, watchparty, offline };
}

function renderStreamGrids() {
  const { official, watchparty } = organizeStreams();

  document.getElementById('watchparty-grid').innerHTML = watchparty.length
    ? watchparty.map(renderStreamCard).join('')
    : '<div style="grid-column:1/-1;text-align:center;color:var(--text3);">目前沒有觀賽直播</div>';
  document.getElementById('watchparty-count').textContent = watchparty.length + ' 個頻道';

  const officialSection = document.getElementById('official-section');
  if (official.length < 1) {
    officialSection.style.display = 'none';
  } else {
    officialSection.style.display = '';
    document.getElementById('official-grid').innerHTML = official.map(renderStreamCard).join('');
    document.getElementById('official-count').textContent = official.length + ' 個頻道';
  }
}

// ════════════════════════════════════════════
// Hero 狀態與渲染
// ════════════════════════════════════════════
let heroIndex = 0;
let heroTab = 'hot'; // 'hot' | 'official'

function getHeroEvents() {
  return appData.events.filter(e => e.線上直播);
}

function renderHero() {
  const events = getHeroEvents();
  if (events.length === 0) {
    document.getElementById('hero-panel-content').innerHTML = '<div style="color:var(--text3);">目前沒有進行中的直播</div>';
    return;
  }

  heroIndex = Math.min(heroIndex, events.length - 1);
  const ev = events[heroIndex];
  const { watchparty, official } = organizeStreams();
  const streamer = heroTab === 'hot' && watchparty.length > 0
    ? watchparty[0]
    : official.length > 0 ? official[0] : watchparty[0];

  if (!streamer) {
    document.getElementById('hero-panel-content').innerHTML = '<div style="color:var(--text3);">沒有可用的直播頻道</div>';
    return;
  }

  const imgEl = document.getElementById('hero-panel-img');
  imgEl.style.backgroundImage = `url(${streamer.縮圖URL})`;

  const contentEl = document.getElementById('hero-panel-content');
  contentEl.innerHTML = `
    <div class="hero-evt-name">${ev.名稱}</div>
    <div class="hero-evt-sub"><span class="hero-live-badge">LIVE</span>${streamer.當前遊戲}</div>
    <div class="hero-bottom-row">
      <div class="hero-streamer-row">
        <img src="${streamer.頭貼URL}" class="hero-avatar" alt="${streamer.頻道名稱}">
        <div>
          <div class="hero-streamer-name">${streamer.頻道名稱}</div>
          <span class="hero-watching-label">觀賽中</span>
        </div>
      </div>
      <button class="btn-primary">一起看 →</button>
    </div>`;

  // tabs
  document.querySelectorAll('.hero-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === heroTab);
  });

  // dots
  const dotsEl = document.getElementById('hero-dots');
  if (events.length > 1) {
    dotsEl.style.display = '';
    dotsEl.innerHTML = events.map((_, i) =>
      `<button class="hero-dot${i === heroIndex ? ' active' : ''}" data-idx="${i}" aria-label="切換到第 ${i+1} 場比賽"></button>`
    ).join('');
  } else {
    dotsEl.style.display = 'none';
  }

  // arrows
  document.getElementById('hero-prev').classList.toggle('disabled', events.length <= 1);
  document.getElementById('hero-next').classList.toggle('disabled', events.length <= 1);

  renderLiveNowList();
}

function renderLiveNowList() {
  const events = getHeroEvents();
  const list = document.getElementById('livenow-list');
  if (!events.length) {
    list.innerHTML = `<div class="rail-list-empty">目前沒有進行中的賽事</div>`;
    return;
  }
  list.innerHTML = events.map((ev, i) => `
    <div class="other-event-item${i === heroIndex ? ' active' : ''}" data-idx="${i}">
      <div class="other-event-thumb" style="background-image:url(${appData.streams[0]?.縮圖URL || ''})"></div>
      <div class="other-event-info">
        <div class="other-event-name">${ev.名稱}</div>
        <div class="other-event-sub"><span class="live-dot-sm"></span>進行中 · ${ev.遊戲 || ''}</div>
      </div>
    </div>`
  ).join('');

  list.querySelectorAll('.other-event-item').forEach(el => {
    el.addEventListener('click', () => {
      heroIndex = Number(el.dataset.idx);
      renderHero();
    });
  });
}

function heroGo(dir) {
  const events = getHeroEvents();
  if (events.length <= 1) return;
  heroIndex = (heroIndex + dir + events.length) % events.length;
  renderHero();
}

document.getElementById('hero-prev').addEventListener('click', () => heroGo(-1));
document.getElementById('hero-next').addEventListener('click', () => heroGo(1));
document.getElementById('hero-dots').addEventListener('click', e => {
  const btn = e.target.closest('.hero-dot');
  if (btn) { heroIndex = Number(btn.dataset.idx); renderHero(); }
});
document.querySelectorAll('.hero-tab').forEach(tab => {
  tab.addEventListener('click', () => { heroTab = tab.dataset.tab; renderHero(); });
});

// 鍵盤左右鍵切換比賽
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') heroGo(-1);
  else if (e.key === 'ArrowRight') heroGo(1);
});

// ════════════════════════════════════════════
// Banner 輪播
// ════════════════════════════════════════════
function createBannerCarousel(containerId, slides) {
  if (!slides.length) {
    const el = document.getElementById(containerId);
    if (el) el.style.display = 'none';
    return;
  }

  let index = 0;
  let timer = null;

  function render() {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.style.display = '';
    el.innerHTML = slides.map((b, i) => `
      <div class="banner-slide${i === index ? ' active' : ''}" style="background-image:url(${b.img})">
        <div class="banner-slide-overlay">
          <div class="banner-slide-title">${b.title}</div>
          <div class="banner-slide-desc">${b.desc}</div>
        </div>
      </div>`
    ).join('') + (slides.length > 1 ? `
      <div class="banner-dots">
        ${slides.map((_, i) => `<button class="banner-dot${i === index ? ' active' : ''}" data-idx="${i}"></button>`).join('')}
      </div>` : '');

    el.querySelectorAll('.banner-dot').forEach(d => {
      d.addEventListener('click', () => { index = Number(d.dataset.idx); render(); restartTimer(); });
    });
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    if (slides.length > 1) {
      timer = setInterval(() => { index = (index + 1) % slides.length; render(); }, 5000);
    }
  }

  render();
  restartTimer();
}

// ════════════════════════════════════════════
// 右側欄：近期賽事
// ════════════════════════════════════════════
function renderUpcomingEvents() {
  const upcoming = appData.events.filter(e => !e.線上直播).slice(0, 4);
  const el = document.getElementById('upcoming-list');
  if (!upcoming.length) {
    el.innerHTML = `<div class="rail-list-empty">目前沒有近期賽事</div>`;
    return;
  }
  el.innerHTML = upcoming.map(item => `
    <div class="rail-list-item">
      <div class="rail-list-thumb">📅</div>
      <div class="rail-list-info">
        <div class="rail-list-name">${item.名稱}</div>
        <div class="rail-list-sub">${item.日期}</div>
      </div>
    </div>`
  ).join('');
}

// ════════════════════════════════════════════
// 左側導覽：分頁切換
// ════════════════════════════════════════════
document.querySelectorAll('.rail-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.rail-item').forEach(i => i.classList.toggle('active', i === item));
    document.querySelectorAll('.page-view').forEach(p => p.classList.toggle('active', p.id === 'page-' + item.dataset.page));
  });
});

// ════════════════════════════════════════════
// 直播頁：篩選 chips + 線上／離線網格
// ════════════════════════════════════════════
const GAME_CHIPS = [
  { key: 'all', label: '全部' },
];

let liveFilterKey = 'all';

function buildGameChips() {
  const games = [...new Set(appData.streams.map(s => s.gameKey).filter(k => k))];
  GAME_CHIPS.length = 1; // 保留 'all'
  games.forEach(g => {
    GAME_CHIPS.push({ key: g, label: g.toUpperCase() });
  });
}

function renderLiveChips() {
  const el = document.getElementById('live-filter-chips');
  el.innerHTML = GAME_CHIPS.map(c =>
    `<button class="chip${c.key === liveFilterKey ? ' active' : ''}" data-key="${c.key}">${c.label}</button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      liveFilterKey = chip.dataset.key;
      renderLiveChips();
      renderLiveGrids();
    });
  });
}

function renderLiveStreamCard(s, offline) {
  return `
    <div class="stream-card">
      <div class="stream-thumb" style="background-image:url(${s.縮圖URL})">
        ${offline ? '' : '<span class="stream-live-dot">LIVE</span>'}
        ${offline ? '' : `<span class="stream-viewers">👁 ${s.觀看人數.toLocaleString()}</span>`}
      </div>
      <div class="stream-info">
        <div class="stream-name">${s.頻道名稱}</div>
        <div class="stream-game">${s.當前遊戲}</div>
      </div>
    </div>`;
}

function renderLiveGrids() {
  const { offline } = organizeStreams();
  const onlineFiltered = appData.streams
    .filter(s => s.線上)
    .filter(s => liveFilterKey === 'all' || s.gameKey === liveFilterKey);
  const offlineFiltered = offline.filter(s => liveFilterKey === 'all' || s.gameKey === liveFilterKey);

  document.getElementById('live-online-grid').innerHTML = onlineFiltered.length
    ? onlineFiltered.map(s => renderLiveStreamCard(s, false)).join('')
    : `<div style="grid-column:1/-1;text-align:center;color:var(--text3);">目前沒有符合條件的直播</div>`;

  document.getElementById('offline-count-label').textContent = offlineFiltered.length ? `(${offlineFiltered.length})` : '';
  document.getElementById('offline-toggle-row').style.display = offlineFiltered.length ? '' : 'none';
  document.getElementById('live-offline-grid').innerHTML = offlineFiltered.map(s => renderLiveStreamCard(s, true)).join('');
}

document.getElementById('offline-toggle-btn').addEventListener('click', () => {
  const btn = document.getElementById('offline-toggle-btn');
  const grid = document.getElementById('live-offline-grid');
  const isOpen = grid.style.display !== 'none';
  grid.style.display = isOpen ? 'none' : '';
  btn.classList.toggle('open', !isOpen);
});

// ════════════════════════════════════════════
// 賽事頁：tabs + TW 篩選 + 卡片
// ════════════════════════════════════════════
let twOnly = false;
let eventsTab = 'featured';

function renderEvCard(ev) {
  if (twOnly && !ev.台灣選手) return '';
  const tags = [];
  if (ev.線上直播) tags.push('<span class="tag tag-live">● 進行中</span>');
  if (ev.台灣選手) tags.push('<span class="tag tag-tw">台灣選手</span>');
  
  return `
    <div class="evcard">
      <div class="evcard-top">
        <div>
          <div class="evcard-tags">${tags.join('')}</div>
          <div class="evcard-name">${ev.名稱}</div>
          <div class="evcard-date">${ev.日期}</div>
        </div>
        ${ev.賽程連結 ? `<button class="evcard-schedule-btn">賽程表</button>` : ''}
      </div>
      ${ev.描述 ? `<div class="evcard-desc">${ev.描述}</div>` : ''}
    </div>`;
}

function renderEventsPage() {
  const featured = appData.events.filter(e => e.分類 === 'featured');
  const social = appData.events.filter(e => e.分類 === 'social');
  const league = appData.events.filter(e => e.分類 === 'league');

  document.getElementById('events-featured-grid').innerHTML = featured.length
    ? featured.map(renderEvCard).join('')
    : `<div style="grid-column:1/-1;text-align:center;color:var(--text3);">目前沒有符合條件的賽事</div>`;
  document.getElementById('events-social-grid').innerHTML = social.length
    ? social.map(renderEvCard).join('')
    : `<div style="grid-column:1/-1;text-align:center;color:var(--text3);">目前沒有符合條件的賽事</div>`;
  document.getElementById('events-league-grid').innerHTML = league.length
    ? league.map(renderEvCard).join('')
    : `<div style="grid-column:1/-1;text-align:center;color:var(--text3);">目前沒有符合條件的賽事</div>`;
}

document.getElementById('tw-toggle').addEventListener('click', function() {
  twOnly = !twOnly;
  this.classList.toggle('on', twOnly);
  renderEventsPage();
});

document.querySelectorAll('#events-tabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    eventsTab = tab.dataset.tab;
    document.querySelectorAll('#events-tabs .tab').forEach(t => t.classList.toggle('active', t === tab));
    document.getElementById('events-featured-panel').classList.toggle('active', eventsTab === 'featured');
    document.getElementById('events-community-panel').classList.toggle('active', eventsTab === 'community');
  });
});

// ════════════════════════════════════════════
// 初始化：載入 Google Sheets 資料
// ════════════════════════════════════════════
async function init() {
  console.log('Initializing app...');
  try {
    appData = await DataLoader.loadWithCache();
    console.log('Data loaded:', appData);

    buildGameChips();
    renderStreamGrids();
    renderHero();
    renderUpcomingEvents();
    renderLiveChips();
    renderLiveGrids();
    renderEventsPage();

    // Banner
    const homeBanners = appData.banners.filter(b => b.page === 'home');
    const communityBanners = appData.banners.filter(b => b.page === 'community');
    createBannerCarousel('banner-home', homeBanners);
    createBannerCarousel('banner-community', communityBanners);

    // 更新時間
    document.getElementById('last-updated-time').textContent =
      new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } catch (error) {
    console.error('Failed to initialize:', error);
  }
}

// 頁面載入時初始化
init();

// 定期重新整理（每 5 分鐘）
setInterval(() => {
  init();
}, 5 * 60 * 1000);
</script>

</body>
</html>
